# Constrói o site (Astro) e publica no GitHub Pages a cada push na branch main.
# Antes do primeiro uso: Settings -> Pages -> Source = "GitHub Actions" (veja o README).
#
# Repositório de PRÉVIA (avaliação): defina a variável do repositório PREVIEW=true
# (Settings -> Secrets and variables -> Actions -> Variables). O build então usa o endereço
# usuario.github.io/nome-do-repo, não usa o domínio neurofernando.com.br e pede ao Google para não indexar.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.PREVIEW == 'true' && format('https://{0}.github.io', github.repository_owner) || '' }}
          BASE_PATH: ${{ vars.PREVIEW == 'true' && format('/{0}', github.event.repository.name) || '' }}
          PUBLIC_PREVIEW: ${{ vars.PREVIEW == 'true' && 'true' || 'false' }}
      - name: Prévia sem domínio próprio
        if: vars.PREVIEW == 'true'
        run: rm -f dist/CNAME dist/sitemap.xml && printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
